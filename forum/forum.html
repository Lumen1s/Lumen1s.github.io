<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foro LUMEN</title>
  <link rel="stylesheet" href="forum.css" />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Pantalla de bienvenida -->
  <div id="welcome-screen" class="welcome active">
    <h1 class="logo-glow">LUMEN</h1>
    <p class="welcome-text">Bienvenido a nuestro foro</p>
    <div class="login-options">
      <button id="loginGoogleBtn">Sign in with Google</button>
      <button id="loginAnonBtn">Entrar sin cuenta</button>
    </div>
  </div>

  <!-- Contenido del foro (oculto hasta login) -->
  <div id="forum-container" class="hidden">
    <header class="forum-header">
      <h1>💬 Foro LUMEN</h1>
      <div id="user-info"></div>
    </header>

    <main class="forum-main">
      <!-- Crear tema -->
      <section class="create-thread" id="createThreadSection">
        <h2>Crea un nuevo tema</h2>
        <input type="text" id="threadTitle" placeholder="Título del tema" />
        <textarea id="threadContent" placeholder="Escribe el primer mensaje..."></textarea>
        <button id="createThreadBtn">Publicar</button>
      </section>

      <!-- Lista de temas -->
      <section class="threads" id="threadsList"></section>
    </main>

    <footer>
      <p>✨ LUMEN — comunidad mística ✨</p>
    </footer>
  </div>

  <script type="module" src="forum.js"></script>
</body>
</html>
