<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foro LUMEN</title>
  <link rel="stylesheet" href="forum.css" />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="forum-header">
    <h1>💬 Foro LUMEN</h1>
    <div id="user-info"></div>
  </header>
<div id="anon-login" class="anon-box">
  <input type="text" id="anonName" placeholder="Escribe tu nombre..." />
  <button id="anonLoginBtn">Entrar sin cuenta</button>
</div>

  <main class="forum-main">
    <!-- Crear tema -->
    <section class="create-thread" id="createThreadSection" hidden>
      <h2>Create a new topic</h2>
      <input type="text" id="threadTitle" placeholder="Topic title" />
      <textarea id="threadContent" placeholder="Write the first message..."></textarea>
      <button id="createThreadBtn">Publish</button>
    </section>

    <!-- Lista de temas -->
    <section class="threads" id="threadsList"></section>
  </main>

  <footer>
    <p>✨ LUMEN — comunidad mística ✨</p>
  </footer>

  <script type="module" src="forum.js"></script>
</body>
</html>
